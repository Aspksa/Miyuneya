name: Проверки запуска
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quick:
    name: Запуск (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22.18.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
      - name: Проверка HiDPI в Chromium — 320 px до 5K, скриншоты
        if: matrix.os == 'ubuntu-latest'
        run: node --test tests/responsive-browser.mjs
      - name: Снимки интерфейса для визуальной проверки
        if: ${{ always() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: miyuneya-hidpi-screenshots
          path: artifacts/ui-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - run: npm run diagnose
  typecheck:
    name: TypeScript — проверка типов (без изменения portable-сборки)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Отдельная среда проверки типов
        run: npm install --prefix tools/typecheck --ignore-scripts --no-audit --no-fund
      - name: Проверка типов src и server
        run: node tools/typecheck/node_modules/typescript/bin/tsc --project tools/typecheck/tsconfig.json
  windows-bootstrap:
    name: Windows — официальная загрузка и автономный повтор
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/windows-network.test.mjs
        env:
          MIYUNEYA_NETWORK_TEST: '1'
