name: Проверенный выпуск Miyuneya
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Подтвердить совпадение версии и тега
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          test -f "docs/releases/v${VERSION}.md"
      - name: Сборка и проверки пакета
        run: |
          npm run build
          npm test
          npm run check
          node scripts/package-release.mjs
      - name: Опубликовать проверенный релиз
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/miyuneya-update.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Miyuneya ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --verify-tag
