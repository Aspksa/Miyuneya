<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="Miyuneya — личное пространство для мыслей, знаний и дел.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <title>Miyuneya — личное пространство</title>
</head>
<body>
  <a class="skip" href="#content">Перейти к содержимому</a>
  <div id="app"><div class="loading">✦<p>Miyuneya открывает ваше пространство…</p></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="editor"><form id="editor-form"><div class="dialog-top"><span class="eyebrow">ВАШЕ ПРОСТРАНСТВО</span><button type="button" class="icon-button" id="close-editor" aria-label="Закрыть">×</button></div><h2 id="editor-heading">Новая заметка</h2><input id="entry-title" required maxlength="200" aria-label="Название" placeholder="Название"><textarea id="entry-body" maxlength="100000" aria-label="Текст заметки" placeholder="Здесь может начаться что-то важное…" rows="10"></textarea><div id="task-fields" hidden><div class="form-grid"><label class="field">Срок<input type="date" id="task-due"></label><label class="field">Приоритет<select id="task-priority"><option value="normal">Обычный</option><option value="high">Высокий</option><option value="low">Низкий</option></select></label><label class="field">Группа<input id="task-group" maxlength="80" placeholder="Например, Работа"></label><label class="field">Родительская задача<select id="task-parent"></select></label><label class="field">Повторение<select id="task-repeat"><option value="">Не повторять</option><option value="day">Дни</option><option value="week">Недели</option><option value="month">Месяцы</option></select></label><label class="field">Каждые<input type="number" id="task-interval" value="1" min="1" max="365"></label></div><label class="field">Зависимости<select id="task-depends" multiple size="4"></select><small>Выберите задачи, которые нужно завершить раньше. Ctrl/⌘ — несколько.</small></label><label class="field">Связанные материалы<select id="task-materials" multiple size="4"></select><small>Заметки и документы диска. Ctrl/⌘ — несколько.</small></label></div><div class="dialog-actions"><button type="button" class="button quiet" id="cancel-editor">Отмена</button><button class="button primary" type="submit">Сохранить</button></div></form></dialog>
  <dialog id="confirm"><form method="dialog"><h2 id="confirm-title">Удалить запись?</h2><p>Удаление записи можно отменить кнопкой «Отменить действие» до следующего изменения. Для ключей и восстановления копии правила отличаются.</p><div class="dialog-actions"><button class="button quiet" value="cancel">Отмена</button><button class="button danger" value="delete">Удалить</button></div></form></dialog>
  <script src="/main.js" type="module"></script>
</body>
</html>
